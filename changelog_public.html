<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Feedback Scoreboard — Ice Maker Tools (private)</title>
<style>
  :root { --bg:#f4f6f9; --panel:#fff; --ink:#1b2430; --muted:#5b6673;
          --line:#dde3ea; --accent:#0b6bcb; --err:#c2372c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14181d; --panel:#1d2329; --ink:#e8ecf1; --muted:#9aa6b2;
            --line:#303841; --accent:#3b8de0; --err:#f28b82; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center;
         justify-content:center; background:var(--bg); color:var(--ink);
         font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px;
          padding:30px 28px; width:min(360px, calc(100vw - 32px));
          box-shadow:0 10px 30px rgba(0,0,0,.12); text-align:center; }
  .logo { font-size:34px; }
  h1 { font-size:18px; margin:8px 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 18px; }
  input { width:100%; border:1px solid var(--line); border-radius:9px;
          padding:10px 12px; font:15px inherit; background:var(--bg);
          color:var(--ink); }
  input:focus { outline:2px solid var(--accent); border-color:transparent; }
  button { width:100%; margin-top:10px; border:none; border-radius:9px;
           padding:10px 0; background:var(--accent); color:#fff;
           font:600 14px inherit; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .msg { font-size:13px; min-height:18px; margin:10px 0 0; color:var(--muted); }
  .msg.err { color:var(--err); }
  .notice { text-align:left; background:#fdf3e3; border:1px solid #e0c48a; color:#6b4e12;
            border-radius:9px; padding:10px 12px; margin:0 0 14px; font-size:12.5px;
            line-height:1.5; }
  @media (prefers-color-scheme: dark) {
    .notice { background:#2e2616; border-color:#5c4a1f; color:#e6cf9a; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">&#129482;</div>
  <h1>Feedback Scoreboard</h1>
  <p class="notice"><b>Why is there a password now?</b> Open access ended after
     these tools were shown outside the company. Every password is personal and
     traces to exactly one person &mdash; keep yours to yourself.</p>
  <p class="sub">Internal Ice-O-Matic review tool. Enter your access password.
     Don't have one? Ask Heath.</p>
  <form id="f">
    <input id="pw" type="password" autocomplete="current-password"
           placeholder="Access password" autofocus>
    <button id="go" type="submit">Unlock</button>
  </form>
  <p id="msg" class="msg"></p>
</div>
<script>

var PAYLOAD = "p/changelog_public.enc";
var STORE = "icegate.k";
var TTL = 7 * 864e5;
var form = document.getElementById("f"), pw = document.getElementById("pw"),
    go = document.getElementById("go"), msg = document.getElementById("msg");

function say(t, err) { msg.textContent = t; msg.className = err ? "msg err" : "msg"; }
function fromB64(s) {
  var b = atob(s), a = new Uint8Array(b.length);
  for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);
  return a;
}
function toHex(a) {
  var s = "";
  for (var i = 0; i < a.length; i++) s += (a[i] < 16 ? "0" : "") + a[i].toString(16);
  return s;
}
function fromHex(s) {
  var a = new Uint8Array(s.length / 2);
  for (var i = 0; i < a.length; i++) a[i] = parseInt(s.substr(i * 2, 2), 16);
  return a;
}
function getStored() {
  try {
    var o = JSON.parse(localStorage.getItem(STORE) || "null");
    if (!o || !o.k || Date.now() - o.t > TTL) { localStorage.removeItem(STORE); return null; }
    return fromHex(o.k);
  } catch (e) { return null; }
}
function store(k) {
  try { localStorage.setItem(STORE, JSON.stringify({ k: toHex(k), t: Date.now() })); }
  catch (e) {}
}
function importAes(bytes) {
  return crypto.subtle.importKey("raw", bytes, "AES-GCM", false, ["decrypt"]);
}
function gunzip(buf) {
  var ds = new DecompressionStream("gzip");
  return new Response(new Blob([buf]).stream().pipeThrough(ds)).text();
}
function loadWith(kBytes) {
  return importAes(kBytes).then(function (key) {
    return fetch(PAYLOAD).then(function (r) {
      if (!r.ok) throw new Error("payload HTTP " + r.status);
      return r.arrayBuffer();
    }).then(function (ab) {
      var u = new Uint8Array(ab);
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: u.slice(0, 12) }, key, u.slice(12));
    });
  }).then(gunzip).then(function (html) {
    store(kBytes); // sliding renewal — active users stay unlocked
    document.open();
    document.write(html);
    document.close();
  });
}
function unwrap(pass) {
  return crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2",
                                 false, ["deriveBits"])
    .then(function (base) {
      return crypto.subtle.deriveBits(
        { name: "PBKDF2", salt: fromB64(M.salt), iterations: M.iter, hash: "SHA-256" },
        base, 256);
    })
    .then(function (bits) { return importAes(new Uint8Array(bits)); })
    .then(function (kek) {
      var i = 0;
      function tryNext() {
        if (i >= M.wraps.length) return null;
        var w = M.wraps[i++];
        return crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(w.iv) }, kek, fromB64(w.ct))
          .then(function (k) { return { k: new Uint8Array(k), id: w.id }; }, tryNext);
      }
      return tryNext();
    });
}
// Best-effort unlock notification — fires only on a typed-password unlock.
// keepalive lets the request finish even as document.write replaces this page.
// Mirrors the feedback widget's FormSubmit call; failure is silently ignored.
function ping(id) {
  try {
    fetch("https://formsubmit.co/ajax/heath.ross@iceomatic.com", { method: "POST", keepalive: true,
      headers: { "Accept": "application/json", "Content-Type": "application/json" },
      body: JSON.stringify({ _subject: "\uD83D\uDD13 Site unlock: " + id,
        _cc: "heathjamesross@gmail.com", _template: "table",
        Person: id, Tool: document.title, When: new Date().toString() })
    }).catch(function () {});
  } catch (e) {}
}
form.addEventListener("submit", function (e) {
  e.preventDefault();
  var pass = pw.value.trim();
  if (!pass) return;
  go.disabled = true;
  say("Checking\u2026");
  unwrap(pass).then(function (res) {
    if (!res) { say("That password doesn't unlock this site.", true); go.disabled = false; pw.select(); return; }
    ping(res.id);
    say("Unlocking\u2026");
    return loadWith(res.k).catch(function (err) {
      say("Unlock failed: " + err.message, true);
      go.disabled = false;
    });
  }).catch(function (err) {
    say("Unlock failed: " + err.message, true);
    go.disabled = false;
  });
});
if (!window.crypto || !crypto.subtle || typeof DecompressionStream === "undefined") {
  say(location.protocol === "file:"
      ? "This is a saved copy \u2014 the protected site only opens from its web address."
      : "This browser can't open the protected site \u2014 use a current Chrome, Safari or Edge.", true);

  var k = getStored();
  if (k) {

    loadWith(k).catch(function () {
